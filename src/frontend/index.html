<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chiperf 可视化</title>
    <!-- 构建时把占位换成 favicon.svg 的 data URI，产物仍是自包含单文件 -->
    <link rel="icon" href="__CHIPERF_FAVICON__" />
    <!--
      chiperf 可视化 —— 单文件页面模板。

      `bun run build` 会把下面两个占位注释替换成内联的 CSS 与打包后的 JS，
      产出 dist/index.html（可直接双击打开，也可以放到任意静态托管）。
      这里保留占位而不是外链，是为了让产物只有一个文件、不依赖相对路径。
    -->
    <style>/*__CHIPERF_STYLES__*/</style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>chiperf 可视化需要启用 JavaScript。</noscript>
    <script>/*__CHIPERF_SCRIPT__*/</script>
  </body>
</html>
