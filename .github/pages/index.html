<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chiperf</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  font-family: ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f6f6f7; color: #3c3c43;
}
main { width: min(46rem, 92vw); padding: 3rem 0; }
h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 .5rem; color: #6f42c1; letter-spacing: .02em; }
p.lead { margin: 0 0 2.5rem; color: #67676c; }
.cards { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
a.card {
  display: block; padding: 1.25rem 1.5rem; border-radius: 12px; text-decoration: none;
  background: #fff; color: inherit; border: 1px solid #e2e2e3; transition: .15s ease;
}
a.card:hover { border-color: #6f42c1; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(111, 66, 193, .15); }
a.card h2 { margin: 0 0 .35rem; font-size: 1.1rem; color: #6f42c1; }
a.card span { font-size: .9rem; color: #67676c; }
@media (prefers-color-scheme: dark) {
  body { background: #1b1b1f; color: #dfdfd6; }
  a.card { background: #242429; border-color: #2e2e32; }
  p.lead, a.card span { color: #98989f; }
}
</style>
</head>
<body>
<main>
  <h1>Chiperf</h1>
  <p class="lead">硬件微架构状态可视化格式 —— 文档与可视化器。</p>
  <div class="cards">
    <a class="card" href="./docs/"><h2>文档</h2><span>格式规范、事件手册与示例</span></a>
    <a class="card" href="./visualize/"><h2>可视化器</h2><span>加载 .chiperf 文件，查看波形与流水线</span></a>
  </div>
</main>
</body>
</html>
